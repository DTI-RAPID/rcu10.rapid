# Admin page settings (Sveltia CMS). Open /admin/ on the live site and sign in with a GitHub token.
# Saving a story commits the Markdown file to GitHub; Vercel then rebuilds the site automatically.

backend:
  name: github
  repo: DTI-RAPID/rcu10.rapid
  branch: main
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"
    uploadMedia: "Upload story image: {{path}}"
    deleteMedia: "Delete story image: {{path}}"

site_url: https://rcu10-rapid.vercel.app
display_url: https://rcu10-rapid.vercel.app

# Site-wide fallback for uploads (unused today); the stories collection keeps its photos next to the stories
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: stories
    label: Featured stories
    label_singular: Featured story
    description: The museum wall on the home page. Youth stories show first, then the newest. Each story also gets its own page at /stories/<file name>/.
    folder: src/content/stories
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [date, title]
    preview_path: /stories/{{slug}}/
    media_folder: images
    public_folder: images
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: tag,
          label: Type,
          widget: select,
          options: [News, Story],
          default: News,
        }
      - {
          name: youth,
          label: Youth story,
          widget: boolean,
          default: false,
          hint: "Shows the gold Youth label and puts the story first on the wall.",
        }
      - {
          name: date,
          label: Date published,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          name: place,
          label: Place,
          widget: string,
          hint: "e.g. Lantapan, Bukidnon",
        }
      - {
          name: summary,
          label: Short summary,
          widget: text,
          hint: "One sentence shown under the wall and in link previews.",
        }
      - {
          name: image,
          label: Main photo,
          widget: image,
          hint: "Landscape photo, about 1600px wide. Shown at the top of the story.",
        }
      - name: photos
        label: More photos
        label_singular: Photo
        widget: list
        required: false
        max: 4
        collapsed: false
        summary: "{{fields.size}}, {{fields.side}}"
        thumbnail: image
        hint: "Optional, up to 4 (5 photos in total with the main photo). They are spread through the story text and alternate left and right."
        fields:
          - { name: image, label: Photo, widget: image }
          - name: size
            label: Size
            widget: select
            default: medium
            options:
              - { label: "Small", value: small }
              - { label: "Medium", value: medium }
              - { label: "Large", value: large }
              - { label: "Full width (no text beside it)", value: full }
          - name: side
            label: Side
            widget: select
            default: auto
            options:
              - { label: "Auto (alternate left and right)", value: auto }
              - { label: "Left", value: left }
              - { label: "Right", value: right }
          - name: after
            label: Place after paragraph
            widget: number
            value_type: int
            min: 0
            required: false
            hint: "Optional. Number of the paragraph to place this photo after (subheadings count as a paragraph). 0 = top of the story. Leave empty for automatic. A number larger than the story puts it at the end."
      - { name: author, label: Author, widget: string }
      - { name: unit, label: Office, widget: string, hint: "e.g. RCU X" }
      - {
          name: body,
          label: Story text,
          widget: markdown,
          hint: "Write or paste the story here (pasting from Word or Google Docs is fine; the text is cleaned on save). A line that is only bold text becomes a subheading. Add photos with the photo fields above, not inside the text.",
        }
      # Set automatically / kept from the original dtirapid.ph articles; not shown to editors
      - { name: articleId, widget: hidden, required: false }
      - { name: source, widget: hidden, required: false }
      - { name: order, widget: hidden, required: false }
      - { name: caption, widget: hidden, required: false }
      - { name: alt, widget: hidden, required: false }
      - { name: alt2, widget: hidden, required: false }
      # older single extra photo; moved into More photos automatically the next time the story is saved
      - { name: image2, widget: hidden, required: false }

  # Home page switches: hide or show sections without deleting them, and pick the featured wall style
  - name: settings
    label: Site settings
    description: Turn home page sections on or off and choose the featured wall style. Hidden sections are kept and come back exactly as they were when switched on.
    editor:
      preview: false
    files:
      - name: homepage
        label: Home page sections
        file: src/data/homepage.json
        format: json
        fields:
          - { name: showHero, label: "Show Hero (3D banner)", widget: boolean, default: false }
          - { name: showAbout, label: "Show About (Introducing the RAPID Growth Project)", widget: boolean, default: false }
          - { name: showImpact, label: "Show Impact (numbers)", widget: boolean, default: false }
          - { name: showWhatWeDo, label: "Show What the project does", widget: boolean, default: false }
          - { name: showWhereWeWork, label: "Show Where we work (Region 10 map)", widget: boolean, default: false }
          - { name: showFeatured, label: "Show Featured stories", widget: boolean, default: true }
          - { name: showNews, label: "Show News and events", widget: boolean, default: true }
          - name: featuredStyle
            label: Featured wall style
            widget: select
            default: clean
            hint: "Clean = large photo with its title card, no frame. Museum = framed photos with the story summary underneath (the earlier look)."
            options:
              - { label: "Clean: large photo, no frame", value: clean }
              - { label: "Museum: framed photos with summary", value: museum }
