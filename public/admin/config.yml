# Admin page settings (Sveltia CMS). Open /admin/ on the live site and sign in with a GitHub token.
# Saving a story commits the Markdown file to GitHub; Vercel then rebuilds the site automatically.

backend:
  name: github
  repo: fhelcraft/test.rapid-r10
  branch: main
  commit_messages:
    create: 'Add featured story: {{slug}}'
    update: 'Update featured story: {{slug}}'
    delete: 'Delete featured story: {{slug}}'
    uploadMedia: 'Upload story image: {{path}}'
    deleteMedia: 'Delete story image: {{path}}'

site_url: https://testrapid-r10.vercel.app
display_url: https://testrapid-r10.vercel.app

# Site-wide fallback for uploads (unused today); the stories collection keeps its photos next to the stories
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: stories
    label: Featured stories
    label_singular: Featured story
    description: The museum wall on the home page. Youth stories show first, then the newest. Each story also gets its own page at /stories/<file name>/.
    folder: src/content/stories
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [date, title]
    preview_path: /stories/{{slug}}/
    media_folder: images
    public_folder: images
    fields:
      - { name: title, label: Title, widget: string }
      - { name: tag, label: Type, widget: select, options: [News, Story], default: News }
      - { name: youth, label: Youth story, widget: boolean, default: false, hint: 'Shows the gold Youth label and puts the story first on the wall.' }
      - { name: date, label: Date published, widget: datetime, date_format: 'YYYY-MM-DD', format: 'YYYY-MM-DD', time_format: false }
      - { name: place, label: Place, widget: string, hint: 'e.g. Lantapan, Bukidnon' }
      - { name: summary, label: Short summary, widget: text, hint: 'One sentence shown under the wall and in link previews.' }
      - { name: image, label: Main photo, widget: image, hint: 'Landscape photo, about 1600px wide. Shown at the top of the story.' }
      - { name: image2, label: Second photo, widget: image, required: false, hint: 'Optional. Shown on the left inside the story text.' }
      - { name: author, label: Author, widget: string }
      - { name: unit, label: Office, widget: string, hint: 'e.g. RCU X' }
      - { name: body, label: Story text, widget: markdown, hint: 'Write the story here. Add photos with the Main photo and Second photo fields above, not inside the text.' }
      # Set automatically / kept from the original dtirapid.ph articles; not shown to editors
      - { name: articleId, widget: hidden, required: false }
      - { name: source, widget: hidden, required: false }
      - { name: order, widget: hidden, required: false }
      - { name: caption, widget: hidden, required: false }
      - { name: alt, widget: hidden, required: false }
      - { name: alt2, widget: hidden, required: false }
